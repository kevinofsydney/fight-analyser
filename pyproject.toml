[project]
name = "fightdb"
version = "0.1.0"
description = "UFC fight database, hypothesis lab and matchup projections"
authors = [{ name = "kevinofsydney" }]
requires-python = ">=3.12"
dependencies = [
    "altair>=6.3.0",
    "duckdb>=2.0.0",
    "httpx>=0.28.1",
    "pandas>=3.1.0",
    "pyarrow>=26.0.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.2",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
    "streamlit>=1.66.1",
    "tenacity>=9.2.1",
    "typer>=0.27.3",
]

[project.scripts]
fightdb = "fightdb.cli:app"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/fightdb/app/**" = ["E402"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true
# Streamlit page scripts are top-level UI code; data access they use (app/data.py) is typed.
exclude = ["src/fightdb/app/pages/", "src/fightdb/app/Home.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
