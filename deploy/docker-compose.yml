# Homelab stack. From the repo root:  make docker-up
# The refresher backfills automatically on first start, then refreshes daily at 11:00 UTC.
name: fight-analyser

x-common: &common
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  image: fight-analyser:latest
  env_file:
    - path: ../.env
      required: false
  # Pinned so paths copied from .env.example can't point outside the /data volume.
  environment:
    DB_PATH: /data/fightdb.duckdb
    DOWNLOAD_DIR: /data/sources
    LOG_DIR: /data/logs
  volumes:
    - fightdb-data:/data
  restart: unless-stopped

services:
  app:
    <<: *common
    ports:
      - "8501:8501"
    # The app only reads the database. The refresher swaps in a new file atomically.

  refresher:
    <<: *common
    command:
      - sh
      - -c
      - "[ -f /data/fightdb.duckdb ] || fightdb -v backfill; exec supercronic /app/deploy/crontab"
    healthcheck:
      disable: true

  # Optional: expose the app through a Cloudflare Tunnel (no open ports).
  # Enable with: docker compose -f deploy/docker-compose.yml --profile tunnel up -d
  # Needs CLOUDFLARE_TUNNEL_TOKEN in .env (never commit it).
  cloudflared:
    image: cloudflare/cloudflared:2025.9.1
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on: [app]
    restart: unless-stopped

volumes:
  fightdb-data:
